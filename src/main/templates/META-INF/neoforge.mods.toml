modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Shows Flywheel models in Distant Horizons LODs.
'''

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="distanthorizons"
    type="required"
    versionRange="[3.4.0-RC1,)"
    ordering="NONE"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="flywheel"
    type="required"
    versionRange="[1.0.4,2.0)"
    ordering="NONE"
    side="CLIENT"
