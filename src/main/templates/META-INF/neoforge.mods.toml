    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="distanthorizons"
    type="required"
    versionRange="[3.4.0-RC1,)"
    ordering="NONE"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="flywheel"
    type="required"
    versionRange="[1.0.4,2.0)"
    ordering="NONE"
    side="CLIENT"
