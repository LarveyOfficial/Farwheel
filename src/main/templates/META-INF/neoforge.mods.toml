modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="farwheel.png"
displayURL="https://modrinth.com/project/farwheel"
authors="Luis Vervaet (Larvey)"
description='''
Flywheel → Distant Horizon block model compatibility layer

Source: https://github.com/LarveyOfficial/Farwheel
'''

[[dependencies."${mod_id}"]]
